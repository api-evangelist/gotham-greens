aid: gotham-greens
name: Gotham Greens
description: >-
  Gotham Greens is an American fresh food and indoor farming company founded in 2009 by Viraj Puri
  and Eric Haley in Brooklyn, New York, where it built one of the first commercial-scale rooftop
  hydroponic greenhouses in the world. The company owns and operates a national network of
  climate-controlled hydroponic greenhouses across the United States, growing pesticide-free leafy
  greens, lettuces and herbs year-round using a fraction of the land and water of conventional
  field agriculture, and delivering them to retail, restaurant and foodservice customers within
  hours of harvest. Under its own brand it sells packaged salad greens, salad kits, fresh herbs,
  salad dressings, dips, pestos and cooking sauces. Gotham Greens is a consumer packaged goods and
  controlled-environment agriculture business rather than a software vendor, and publishes no
  commercial or developer-facing product API. The only machine-readable interface it exposes is
  the WordPress REST content API behind its corporate website at gothamgreens.com, captured here
  for discovery purposes.
